
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#030712" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sfondo Icona Android Squircle Safe Zone -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Bordo sottile di lusso -->
  <rect x="20" y="20" width="472" height="472" rx="112" stroke="url(#brandGrad)" stroke-width="6" opacity="0.75" fill="none" />

  <!-- Sfondo centrale in glassmorphism scuro -->
  <rect x="56" y="56" width="400" height="400" rx="84" fill="#18181b" fill-opacity="0.8" stroke="rgba(255,255,255,0.15)" stroke-width="2" />

  <!-- Onde audio centrali -->
  <rect x="110" y="220" width="22" height="80" rx="11" fill="url(#brandGrad)" filter="url(#glow)" />
  <rect x="148" y="170" width="22" height="170" rx="11" fill="url(#brandGrad)" filter="url(#glow)" />
  <rect x="186" y="120" width="24" height="270" rx="12" fill="url(#brandGrad)" filter="url(#glow)" />
  <rect x="226" y="190" width="22" height="140" rx="11" fill="url(#brandGrad)" filter="url(#glow)" />
  
  <!-- Icona Flow Music Note & Connection -->
  <circle cx="330" cy="290" r="42" fill="url(#brandGrad)" filter="url(#glow)" />
  <rect x="350" y="130" width="22" height="160" rx="11" fill="url(#brandGrad)" filter="url(#glow)" />
  <path d="M350 130 C 370 110, 420 120, 430 160 C 400 160, 372 155, 372 155" stroke="url(#brandGrad)" stroke-width="20" stroke-linecap="round" fill="none" filter="url(#glow)" />
</svg>
